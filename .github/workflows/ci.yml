# Starting CI template for a consuming repo: copy to
# `.github/workflows/ci.yml` and adjust as the repo needs.
#
# Most repos in the org currently run no automated checks at all; this is
# the floor every repo gets on day one, not the ceiling. Three stages,
# consistent names across every repo that copies this (C4), so "the lint
# job" and "the build job" mean the same thing everywhere:
#
#   lint  - advisory during rollout; see the staged-rollout note on the
#           lint job below. Turning a linter on across an established
#           codebase produces a pile of findings unrelated to whatever PR
#           happens to trip the check first, and a check people learn to
#           click past is worse than no check. Clear the backlog in its own
#           dedicated PR before enforcing. Don't skip straight to blocking.
#   test  - runs the repo's test suite. If there isn't one yet, it still
#           runs (and passes) rather than being skipped outright; see the
#           "no tests" branch below. The floor is never zero (C5).
#   build - `uv build`, then install the built wheel into a clean
#           environment and import it, then keep the artifacts. A green
#           test suite only proves the source tree works; tests run
#           against source, but users install the built package, so a
#           repo can be fully green on tests and still be broken to
#           install. This stage is what actually catches that (C2) --
#           and it takes the verify step to do it, because `uv build`
#           alone reports success for a wheel containing nothing.
#
# `uv sync --locked` in every job fails if uv.lock is out of date, so this
# always runs on a clean, from-lockfile install rather than trusting
# whatever's already resolved on a developer's machine (C3).
#
# Must stay callable both directly on pull_request AND as a reusable
# workflow_call: the version.yml stub does `needs: ci` onto this file by
# reference (`uses: ./.github/workflows/ci.yml`).
#
# `name: CI` below is what makes checks display as `CI / lint` etc.
# instead of falling back to the file path (`.github/workflows/ci.yml /
# lint`). Safe to add: required-status-check contexts are job names
# (`lint`, `test`, `build`), not the workflow name, so this doesn't touch
# branch protection.
#
# emergent-matter-sdm-materials is installed from the org's package index
# (see `[tool.uv.index]` / `[tool.uv.sources]` in pyproject.toml), so every
# job below checks out only this repo -- no sibling checkout, no PAT.

name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    # ENFORCED. `continue-on-error` was removed here; the staged rollout it
    # supported is finished. A lint failure now fails the job, the run, and
    # the check -- and failing the RUN is the half that matters for
    # releases, since it stops a lint failure sailing through
    # version.yml's `needs: ci`.
    #
    # That is only half the gate. The other half is `lint` being in this
    # repo's required status checks, which is a branch-protection setting,
    # not a file -- applied with `lint_gate.py on` from the actions repo.
    # Until both halves are on, `lint_gate.py status` reads INCONSISTENT.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          # Distinct per job: lint/test/build all cache the same
          # dependency set and, run concurrently, raced the same
          # setup-uv-2-... cache key ("Failed to save: Unable to reserve
          # cache") without this.
          cache-suffix: lint

      - run: uv sync --locked

      - run: uv run ruff check .

  format:
    name: format
    runs-on: ubuntu-latest
    # Enforced: no continue-on-error, and `format` is a required status
    # check. Stage it back to advisory with `lint_gate.py --job format off`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          cache-suffix: format

      - run: uv sync --locked

      - run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    # Enforced: no continue-on-error, and `typecheck` is a required status
    # check. Stage it back to advisory with `lint_gate.py --job typecheck off`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          cache-suffix: typecheck

      - run: uv sync --locked

      - name: mypy
        run: |
          if [ -d src ]; then
            uv run mypy src
          else
            echo "No src/ directory yet -- nothing to typecheck."
          fi

  schema:
    name: schema
    runs-on: ubuntu-latest
    # Generation gate for the .sdm JSON Schema and version index: fails if
    # regenerating src/software_defined_matter/schema/ from wire.py produces
    # a diff, so a hand-edited schema file (or a wire.py change nobody
    # regenerated for) can't land silently. See schema/_generate.py.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          cache-suffix: schema

      - run: uv sync --locked

      - name: Regenerate the .sdm schema and version index
        run: uv run python -m software_defined_matter.schema._generate

      - name: Fail if generation drifted from the committed files
        run: git diff --exit-code -- src/software_defined_matter/schema/

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          cache-suffix: test

      - name: Install software shader runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri

      # Install must be the step immediately before the test run, with
      # nothing that writes a version string in between. Some repos have
      # tests that read INSTALLED package metadata (importlib.metadata),
      # not the source tree, e.g. emergent-matter-sdm-materials asserts
      # importlib.metadata.version() agrees with the module's __version__.
      # A fresh sync right before the test step, on every run, makes that
      # class of "environment vs. tree" drift structurally impossible:
      # it's a concrete instance of why C3 requires a clean-machine,
      # from-lockfile install rather than a persisted/cached environment.
      # If you add a step here later, keep it above this line, not between
      # sync and test.
      - run: uv sync --locked

      - name: Run tests
        env:
          SDM_REQUIRE_GLSL: "1"
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          if [ -d tests ]; then
            uv run pytest -n auto
          else
            echo "No tests/ directory yet: nothing to run. (install + build still ran below.)"
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    # verify-wheel (below) installs the built wheel into a brand-new venv from
    # a bare temp directory with no pyproject.toml in it, so pyproject.toml's
    # `[[tool.uv.index]]` ("em") is invisible to that install -- project index
    # config only applies inside the project it's declared in. UV_INDEX names
    # the same index as an extra index for that one `uv pip install`, the same
    # way UV_FIND_LINKS pointed at the wheelhouse before materials was
    # published. Verified: `uv pip install <wheel>` resolves
    # emergent-matter-sdm-materials from here with no other config present.
    env:
      UV_INDEX: https://get.softwaredefinedmatter.com/simple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          cache-suffix: build

      - run: uv sync --locked

      - run: uv build

      # `uv build` exiting 0 does NOT mean the wheel is usable. Verified
      # against hatchling: a wheel target naming a package directory that
      # doesn't exist, and `exclude = ["*"]`, both build "successfully" and
      # produce an artifact with nothing importable in it. Without this step
      # the build stage only catches builds that fail outright, which is a
      # weaker claim than the one at the top of this file.
      #
      # This installs the wheel into a clean environment, from outside the
      # checkout, and imports what it declares. Referenced rather than
      # inlined so a fix reaches every repo when `v1` moves -- unlike this
      # file, which is a copy. See the job-level UV_INDEX above for how
      # this step's install resolves emergent-matter-sdm-materials.
      - uses: EmergentMatter/actions/verify-wheel@v1
        with:
          package-name: emergent-matter-sdm-core

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          retention-days: 14
          if-no-files-found: error
